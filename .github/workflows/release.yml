name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Build Semantic Memory MCP Server
        working-directory: plugins/semantic-memory
        run: |
          npm ci
          npm run build

      - name: Verify Build Artifacts
        run: test -f plugins/semantic-memory/dist/index.js

      - name: Create Archive
        run: |
          tar -czf "flow-marketplace-${GITHUB_REF_NAME#v}.tar.gz" \
            --exclude='node_modules' \
            --exclude='*.log' \
            .claude-plugin/ plugins/ README.md CHANGELOG.md LICENSE

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "flow-marketplace-${GITHUB_REF_NAME#v}.tar.gz" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
