# Labeler v5 configuration - labels PRs based on changed files
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/package.json"
          - "**/package-lock.json"

ci/cd:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

flow-plugin:
  - changed-files:
      - any-glob-to-any-file:
          - "plugins/flow/**"

semantic-memory:
  - changed-files:
      - any-glob-to-any-file:
          - "plugins/semantic-memory/**"
